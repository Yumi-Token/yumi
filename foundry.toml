[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# 배포 후 Basescan 소스 검증에 필요합니다.
# 검증이 안 된 컨트랙트는 아무도 신뢰하지 않습니다.
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = {key = "${BASESCAN_API_KEY}", chain = 84532}
base = {key = "${BASESCAN_API_KEY}", chain = 8453}
