# 주간 수집기가 읽는 주소입니다. 비밀이 아닙니다 — 전부 공개 주소입니다.
# 이 파일이 저장소에 있기 때문에 누구나 같은 명령으로 같은 숫자를 얻을 수 있습니다.
#
# 🔴 PRIVATE_KEY 나 니모닉을 여기 넣지 마세요.
#    앵커 지갑은 주소만 필요합니다. 이 스크립트는 서명을 하지 않습니다.
#
# 주소의 출처는 docs/WALLETS.md 입니다. 둘이 어긋나면 그것도 어긋난 상태입니다.
# (docs/PRE-PUBLISH.md 「3. 문서 정합」에 대조 항목이 있습니다)

# ─── 데이터를 읽는 곳 ────────────────────────────────
# 아래 컨트랙트 주소들이 실제로 배포돼 있는 네트워크입니다.
# 메인넷 배포 후에 주소와 함께 "base" / mainnet.base.org 로 바꿉니다.

NETWORK="base-sepolia"
RPC_URL="https://sepolia.base.org"
EXPLORER="https://sepolia.basescan.org"

# ─── 앵커를 보내는 곳 ────────────────────────────────
# 🔴 앵커는 **언제나 Base 메인넷**입니다. 위와 무관합니다.
#
# 토큰이 아직 메인넷에 없어도 상관없습니다 — 앵커는 0원 트랜잭션에
# 해시만 싣는 것이라 토큰과 무관합니다. 그리고 테스트넷은 언젠가 종료되고,
# 그러면 종료 조건(D-009)의 판정 근거가 함께 사라집니다.
#
# 데이터는 토큰이 있는 곳에서 읽고, 판정은 영구한 곳에 남깁니다.

# 앵커 문자열 끝에 붙습니다. 체인에서 앵커를 먼저 발견한 사람이
# 저장소를 찾을 수 있게 하기 위한 것입니다 — 앵커 하나가 자기완결적이 됩니다.
REPO="github.com/Yumi-Token/yumi"

ANCHOR_NETWORK="base"
ANCHOR_RPC_URL="https://mainnet.base.org"
ANCHOR_EXPLORER="https://basescan.org"

